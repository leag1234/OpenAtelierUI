name: Bug report
description: Report a reproducible OpenAtelierUI problem
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Search the OpenAtelierUI issues before filing a new report. Do not include credentials or private data.
  - type: input
    id: version
    attributes:
      label: OpenAtelierUI version or commit
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options: ["Native Python", "Docker Compose", "Kubernetes", "Other"]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the smallest safe sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials and private data.
          required: true
        - label: I searched existing OpenAtelierUI issues.
          required: true
