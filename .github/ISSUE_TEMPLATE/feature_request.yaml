name: Feature request
description: Propose a focused OpenAtelierUI improvement
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the concrete user journey and current limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the observable result without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and migration impact
      description: Note any effect on existing integrations, plugins, data, security or resources.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing OpenAtelierUI issues.
          required: true
