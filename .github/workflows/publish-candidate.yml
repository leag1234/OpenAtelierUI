name: Publish qualified test candidate

on:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/leag1234/openatelierui
  SOURCE_SHA: 2750e081666a89f726f337f78f7e0bcfaa9c4b18
  TEST_TAG: candidate-2750e08

jobs:
  publish-amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the qualified source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify the immutable source revision
        run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the qualified test image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TEST_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/leag1234/OpenAtelierUI
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.version=${{ env.TEST_TAG }}
          build-args: |
            BUILD_HASH=${{ env.SOURCE_SHA }}
          cache-from: type=gha,scope=qualified-candidate-amd64
          cache-to: type=gha,mode=max,scope=qualified-candidate-amd64
          provenance: mode=max
          sbom: true

      - name: Record immutable publication identity
        run: |
          test -n "${DIGEST}"
          printf '%s@%s\n' "${IMAGE}" "${DIGEST}"
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
